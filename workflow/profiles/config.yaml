# Cluster profile for strand-creator.
# Run from the repository root:
#   snakemake --profile workflow/profiles --configfile config/config.yaml

cluster: mkdir -p logs/{rule} errors/{rule} &&
  sbatch
  --partition={resources.partition}
  --qos={resources.qos}
  --cpus-per-task={threads}
  --mem={resources.mem_mb}
  --job-name={rule}-{wildcards}
  --output=logs/{rule}/%j.out
  --error=errors/{rule}/%j.error
  --time={resources.time}

default-resources:
  - partition=short
  - qos=normal
  - mem_mb=32000
  - time="04:00:00"

max-jobs-per-second: 100
max-status-checks-per-second: 100
local-cores: 1
latency-wait: 60
jobs: 200

use-conda: false
